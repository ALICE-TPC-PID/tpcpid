name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  CI:
    runs-on: ubuntu-latest

    container:
      image: rootproject/root:6.30.06-ubuntu22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m ensurepip --upgrade || true
          apt-get update
          apt-get install -y git ca-certificates python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run CI test
        run: |
          python3 run/ci/ci_test.py

      - name: Test bounded-memory data loading and training
        run: |
          python3 -m unittest discover -s tests -p 'test_training_memory.py' -v

      - name: Test MEAN SIGMA FULL training pipeline
        run: |
          python3 tests/smoke_training_pipeline.py
