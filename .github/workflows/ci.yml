name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: rootproject/root:6.30.06-ubuntu22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python3 -m ensurepip --upgrade || true
          apt-get update
          apt-get install -y git ca-certificates python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r requirements.txt
      - name: Check O2Physics CI runner
        run: python3 -m unittest discover -s tests -p test_o2physics_ci.py -v
      - name: Train CI networks (20 epochs each)
        run: python3 run/ci/ci_test.py --artifact-dir output/ci-artifacts
      - name: Upload CI networks
        uses: actions/upload-artifact@v4
        with:
          name: ci-networks
          path: output/ci-artifacts
          if-no-files-found: error
          retention-days: 7

  O2Physics:
    needs: CI
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download networks from this CI run
        uses: actions/download-artifact@v4
        with:
          name: ci-networks
          path: output/ci-artifacts
      - name: Mount ALICE CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@v5
        with:
          cvmfs_repositories: alice.cern.ch
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
      - name: Test CI networks in latest O2Physics
        run: >-
          python3 run/ci/o2physics/o2physics_pid_test.py
          --artifact-dir output/ci-artifacts
          --output-dir output/o2physics-ci
      - name: Upload O2Physics diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2physics-ci
          path: output/o2physics-ci
          if-no-files-found: warn
          retention-days: 7
